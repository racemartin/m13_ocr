# ============================================================================
# Configuration Nginx : sert Angular et proxy les appels API vers backend
# ============================================================================
server {
    listen 80;

    # Sert les fichiers statiques compiles d'Angular
    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Redirige les appels /api/ vers le conteneur backend (reseau Docker)
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
