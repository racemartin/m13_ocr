<div class="mise-en-page">

  <nav class="menu-lateral">
    <img src="/logo-ffe.png" alt="Logo FFE" class="logo" />
    <h1>FFE Chess Agent</h1>
    <button
      type="button"
      [class.actif]="vueActive() === 'echiquier'"
      (click)="choisirVue('echiquier')"
    >
      Échiquier
    </button>
    <button
      type="button"
      [class.actif]="vueActive() === 'admin'"
      (click)="choisirVue('admin')"
    >
      Admin
    </button>
  </nav>

  <main class="contenu">
    @if (vueActive() === 'admin') {
      <app-admin-debug />
    } @else {
      <app-echiquier />
    }
  </main>

</div>
