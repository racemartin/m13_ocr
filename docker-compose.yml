services:
  # --------------------------------------------------------------------
  # Backend : API FastAPI (couche presentation + couche domaine)
  # --------------------------------------------------------------------
  backend:
    build:
      context: ./backend
    container_name: ffe_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      milvus-standalone:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------------------
  # Frontend : Angular servi par Nginx (reverse proxy vers le backend)
  # --------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
    container_name: ffe_frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

  # --------------------------------------------------------------------
  # Milvus : base vectorielle (RAG, etape 3)
  # --------------------------------------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: ffe_etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: ffe_minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  milvus-standalone:
    image: milvusdb/milvus:v2.4.15
    container_name: ffe_milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --------------------------------------------------------------------
  # MongoDB : persistance de l'etat de l'agent (checkpointer LangGraph)
  # --------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: ffe_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  mongo_data:
  huggingface_cache: